package:
  name: node-fs
  dependencies:
    - aff
    - datetime
    - effect
    - either
    - enums
    - exceptions
    - functions
    - integers
    - js-date
    - maybe
    - node-buffer
    - node-path
    - node-streams
    - nullable
    - partial
    - prelude
    - strings
    - unsafe-coerce

  test:
    main: Test.Main
    dependencies:
      - aff
      - assert
      - node-event-emitter
      - console
      - effect
      - exceptions
      - partial
      - st
      - minibench
      - arrays
      - either
      - foldable-traversable
      - maybe
      - prelude
      - refs
      - tailrec

workspace:
  backend:
    cmd: ../purust/bin/purust
    args: [--main, Test.Main, --source, output, --out, output/purust_output, --threaded]
  packageSet:
    registry: 77.7.0
  extraPackages:
    aff:
      path: "../purust-aff"
    argonaut-core:
      path: "../purust-argonaut-core"
